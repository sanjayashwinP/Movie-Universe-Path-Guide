# Production Configuration for CineVerse Backend
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cineverse}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:cineverse_user}
    password: ${SPRING_DATASOURCE_PASSWORD:cineverse_secure_password_2026}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

cineverse:
  jwt:
    secret: ${JWT_SECRET:4c696e65566572736553757065725365637572654a57545365637265744b65793230323621402324255e262a}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173}

logging:
  level:
    root: INFO
    com.cineverse: INFO
    org.springframework.security: WARN
