server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: cineverse-backend
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false

---
# Development Profile (Default, In-memory / persistent H2 with Postgres mode)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:cineversedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

---
# Production Profile (PostgreSQL)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cineverse}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

---
# Application Security & Custom Properties
cineverse:
  jwt:
    secret: ${JWT_SECRET:4c696e65566572736553757065725365637572654a57545365637265744b65793230323621402324255e262a}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
