version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cineverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cineverse
      POSTGRES_USER: ${DB_USER:-cineverse_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cineverse_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineverse_user -d cineverse"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cineverse-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cineverse
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cineverse_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cineverse_secure_password_2026}
      JWT_SECRET: ${JWT_SECRET:-4c696e65566572736553757065725365637572654a57545365637265744b65793230323621402324255e262a}
      CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cineverse-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
